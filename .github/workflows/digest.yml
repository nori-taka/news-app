name: 朝夕のニュースメール

# 新聞・通信の新着を、朝7時・昼12時・夕18時ごろ（日本時間）にメールで送る。
# GitHub の定時実行は少し遅れて始まるので、10分前に起動する。
# 公共情報アプリ（7:35・16:35）とはずらしてある。
# 手動実行（Actionsタブの「Run workflow」）でも送れる。
on:
  schedule:
    - cron: "50 21 * * *"  # 日本時間 6:50 → 7時ごろ着
    - cron: "50 2 * * *"   # 日本時間 11:50 → 12時ごろ着
    - cron: "50 8 * * *"   # 日本時間 17:50 → 18時ごろ着
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 各社のRSSを取得
        run: python fetch_feeds.py
      - name: メールを送る
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_digest.py
